spring.application.name=analisador-acoes
server.port=8080

# Token da BRAPI - obtenha gratuitamente em https://brapi.dev/dashboard
# Para PETR4, VALE3, ITUB4 e MGLU3 nao precisa de token
brapi.token=${BRAPI_TOKEN:}
brapi.base-url=https://brapi.dev
# Tempo maximo de espera por resposta da BRAPI
brapi.timeout-seconds=10

# Thymeleaf
spring.thymeleaf.cache=false

# Servidor MCP (Spring AI) - expoe a analise como ferramenta de agente.
# Transporte SSE sobre Spring MVC (endpoint padrao /sse).
spring.ai.mcp.server.name=analisador-acoes
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=SYNC
